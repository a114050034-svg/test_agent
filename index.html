<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Antigravity 破冰成功！</title>
  <style>
    :root {
      --primary-gradient: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%);
      --card-bg: rgba(255, 255, 255, 0.85);
      --card-border: rgba(255, 255, 255, 0.9);
      --btn-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      --btn-glow: rgba(118, 75, 162, 0.45);
      --text-color: #2d3748;
      --subtext-color: #718096;
      --accent-color: #6b46c1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Microsoft JhengHei", sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 30%, #e0c3fc 70%, #8ec5fc 100%);
      background-size: 300% 300%;
      animation: gradientShift 15s ease infinite;
      padding: 20px;
      color: var(--text-color);
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      padding: 48px 40px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08), 0 1px 3px rgba(0, 0, 0, 0.05);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 28px 50px rgba(0, 0, 0, 0.12);
    }

    .badge {
      display: inline-block;
      padding: 6px 16px;
      background: linear-gradient(135deg, #e9d5ff 0%, #fbcfe8 100%);
      color: var(--accent-color);
      font-size: 0.875rem;
      font-weight: 600;
      border-radius: 9999px;
      margin-bottom: 20px;
      letter-spacing: 0.05em;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #4a5568 0%, #2b6cb0 50%, #6b46c1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.02em;
    }

    .subtitle {
      font-size: 1rem;
      color: var(--subtext-color);
      margin-bottom: 32px;
      line-height: 1.6;
    }

    .glow-button {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 16px 36px;
      font-size: 1.125rem;
      font-weight: 600;
      color: #ffffff;
      background: var(--btn-gradient);
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 8px 24px var(--btn-glow), 0 0 20px rgba(102, 126, 234, 0.35);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      user-select: none;
      outline: none;
    }

    .glow-button:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 12px 30px var(--btn-glow), 0 0 35px rgba(118, 75, 162, 0.6);
      filter: brightness(1.06);
    }

    .glow-button:active {
      transform: translateY(1px) scale(0.98);
      box-shadow: 0 4px 15px var(--btn-glow);
    }

    .glow-button .sparkle {
      font-size: 1.25rem;
      transition: transform 0.3s ease;
    }

    .glow-button:hover .sparkle {
      transform: rotate(20deg) scale(1.2);
    }

    .info-container {
      margin-top: 36px;
      min-height: 90px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .count-display {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--accent-color);
      margin-bottom: 10px;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .count-display.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .quote-box {
      font-size: 0.95rem;
      color: #4a5568;
      background: rgba(247, 250, 252, 0.8);
      border: 1px dashed #cbd5e1;
      border-radius: 14px;
      padding: 12px 20px;
      max-width: 100%;
      line-height: 1.6;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.35s ease, transform 0.35s ease;
    }

    .quote-box.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .pulse {
      animation: pop 0.3s ease;
    }

    @keyframes pop {
      0% { transform: scale(1); }
      50% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge">✨ Ready to Explore</div>
    <h1>Antigravity 破冰成功！</h1>
    <p class="subtitle">點擊下方按鈕，開啟今天滿滿的創造力與好心情</p>

    <button id="icebreakerBtn" class="glow-button" type="button">
      <span class="sparkle">✦</span>
      <span>領取今日能量</span>
      <span class="sparkle">✦</span>
    </button>

    <div class="info-container">
      <div id="countDisplay" class="count-display"></div>
      <div id="quoteBox" class="quote-box"></div>
    </div>
  </main>

  <script>
    const quotes = [
      "「每一步都是前進，今天的你非常棒！」",
      "「保持好奇心，最精彩的成果正在路上！」",
      "「寫下優雅的程式碼，點亮無限可能的世界！」",
      "「點滴積累終成江海，繼續保持熱忱前行！」",
      "「相信自己的直覺與能力，今天也是超棒的一天！」",
      "「休息一下深呼吸，你的努力已經開始發光！」",
      "「探索未知的過程，本身就是最美好的冒險。」",
      "「每天都是一個嶄新的起點，盡情發揮創造力吧！」"
    ];

    let count = 0;
    let lastQuoteIndex = -1;

    const button = document.getElementById("icebreakerBtn");
    const countDisplay = document.getElementById("countDisplay");
    const quoteBox = document.getElementById("quoteBox");

    button.addEventListener("click", () => {
      count++;

      // 更新點擊次數
      countDisplay.textContent = `已點擊 ${count} 次`;
      countDisplay.classList.add("visible");
      countDisplay.classList.remove("pulse");
      void countDisplay.offsetWidth; // 強制重繪以觸發動畫
      countDisplay.classList.add("pulse");

      // 隨機選取不與上次重複的鼓勵小語
      let newIndex;
      do {
        newIndex = Math.floor(Math.random() * quotes.length);
      } while (quotes.length > 1 && newIndex === lastQuoteIndex);

      lastQuoteIndex = newIndex;
      quoteBox.textContent = quotes[newIndex];
      quoteBox.classList.add("visible");
    });
  </script>
</body>
</html>
